<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinogni - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <nav class="flex justify-between items-center bg-gray-200 px-6 py-4 shadow">
    <div class="text-2xl font-bold text-blue-700">Kinogni</div>
    <div class="flex items-center gap-4 text-sm italic">
      <span id="userInfo"></span>
      <a href="/" onclick="localStorage.clear()" class="text-red-500 font-bold">Déconnexion</a>
    </div>
  </nav>

  <section class="text-center py-12 bg-white shadow-inner">
    <h1 class="text-3xl font-bold text-blue-600">Dashboard d'Analyse</h1>
    <div class="mt-8 max-w-xl mx-auto px-4 flex gap-2">
      <input type="text" id="movieInput" placeholder="Rechercher un film..." class="w-full p-3 border rounded-lg outline-none">
      <button onclick="chercherFilms()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Chercher</button>
    </div>
  </section>

  <div class="max-w-4xl mx-auto my-10 px-4">
    <div id="resultsContainer" class="grid gap-4 text-center text-gray-400 italic">
      <p>Entrez un titre pour commencer.</p>
    </div>
  </div>

  <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl text-center shadow-xl">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
      <p class="font-bold">Analyse en cours...</p>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = '/';
    else document.getElementById('userInfo').innerText = "Session : " + user.username;

    let currentFilmId = null;
    const resultsContainer = document.getElementById('resultsContainer');

    async function chercherFilms() {
      const query = document.getElementById('movieInput').value.trim();
      if (!query) return;
      resultsContainer.innerHTML = 'Recherche...';
      const response = await fetch(`/films/liste?nom=${encodeURIComponent(query)}`);
      const result = await response.json();
      afficherResultats(result.data);
    }

    function afficherResultats(movies) {
      resultsContainer.innerHTML = "";
      movies.forEach(movie => {
        const id = movie.film_id || movie.id;
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-white p-4 rounded shadow border-l-4 border-blue-500";
        div.innerHTML = `
          <div class="text-left"><h3 class="font-bold">${movie.titre}</h3><p class="text-xs italic text-gray-500">${movie.date_sortie}</p></div>
          <button onclick="analyseFilm('${id}')" class="bg-green-600 text-white px-4 py-2 rounded-full font-bold">Analyser</button>
        `;
        resultsContainer.appendChild(div);
      });
    }

    async function analyseFilm(filmId) {
      currentFilmId = filmId;
      document.getElementById('loader').classList.remove('hidden');
      try {
        const response = await fetch(`/films/reviews/${filmId}`);
        const json = await response.json();
        const reviews = json.data || [];
        const sentiments = json.Sentiments || [];

        let html = `
          <div class="flex justify-between items-center mb-6">
            <button onclick="location.reload()" class="text-blue-600 underline font-bold">← Retour</button>
            <button onclick="ouvrirZoneAjout()" class="bg-blue-600 text-white px-4 py-2 rounded shadow font-bold">+ Ajouter mon avis</button>
          </div>
          <div id="zoneSaisie"></div>
        `;

        reviews.forEach((rev, index) => {
          const s = sentiments[index] || ["Inconnu", 0];
          const isOwner = (rev.auteur === user.username);
          
          html += `
            <div class="bg-white p-5 rounded shadow border-l-8 mb-4 text-left relative">
              <div class="flex justify-between items-start mb-2 font-bold text-sm">
                <span class="text-blue-700 uppercase">${rev.auteur || "Anonyme"}</span>
                <div class="flex items-center gap-2">
                  <span class="bg-gray-100 px-2 py-1 rounded text-[10px] uppercase">${s[0]}</span>
                  ${isOwner ? `
                    <button onclick="preparerModif('${rev.review_id}', \`${rev.contenu}\`)" class="text-orange-500 text-xs underline">Modifier</button>
                    <button onclick="supprimerAvis('${rev.review_id}')" class="text-red-500 text-xs underline">Supprimer</button>
                  ` : ''}
                </div>
              </div>
              <p id="text-${rev.review_id}" class="text-gray-700 italic text-sm whitespace-pre-line">${rev.contenu}</p>
              ${rev.edited ? '<span class="text-[10px] text-blue-400 font-bold block mt-2">● MODIFIÉ</span>' : ''}
            </div>
          `;
        });
        resultsContainer.innerHTML = html;
        window.scrollTo(0, 0);
      } catch (e) { alert("Erreur."); } finally { document.getElementById('loader').classList.add('hidden'); }
    }

    function ouvrirZoneAjout() {
      document.getElementById('zoneSaisie').innerHTML = `
        <div class="bg-blue-50 p-4 rounded mb-6 border border-blue-200">
          <textarea id="nouveauContenu" class="w-full p-2 border rounded" placeholder="Écrire votre avis..."></textarea>
          <button onclick="publierAvis()" class="mt-2 bg-blue-600 text-white px-4 py-1 rounded text-sm font-bold">Publier</button>
        </div>
      `;
    }

    async function publierAvis() {
      const contenu = document.getElementById('nouveauContenu').value;
      if (!contenu) return;
      
      const payload = { 
            film_id: Number(currentFilmId), // S'assurer que c'est un nombre
            user_id: user.id, 
            username: user.username, 
            contenu: contenu 
      };

      try {
          const res = await fetch('/films/reviews/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });

          if(res.ok) {
              await analyseFilm(currentFilmId); 
          } else {
              const err = await res.json();
              alert("Erreur: " + (err.detail || "Inconnue"));
          }
      } catch (error) {
          console.error("Erreur réseau:", error);
          alert("Impossible de joindre le serveur");
      }
    }

    async function validerModif(id) {
      const contenu = document.getElementById(`edit-${id}`).value;
      const res = await fetch(`/films/reviews/update/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ contenu: contenu })
      });
      if(res.ok) await analyseFilm(currentFilmId);
    }

    async function supprimerAvis(id) {
      if(!confirm("Supprimer ?")) return;
      const res = await fetch(`/films/reviews/delete/${id}`, { method: 'DELETE' });
      if(res.ok) await analyseFilm(currentFilmId);
    }
    
    function preparerModif(id, texte) {
      document.getElementById(`text-${id}`).innerHTML = `
        <textarea id="edit-${id}" class="w-full p-2 border rounded text-sm">${texte}</textarea>
        <button onclick="validerModif('${id}')" class="mt-2 bg-orange-500 text-white px-3 py-1 rounded text-xs font-bold">Enregistrer</button>
      `;
    }
  </script>
</body>
</html>
